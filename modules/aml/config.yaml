# ---------------------------------------------------------------------------
# Synthetic AML dataset generator - configuration
# Every knob here is meant to be swept. The `difficulty` knob under
# `laundering` is the Red-Team dial: 0.0 = blatant, 1.0 = subtle.
# ---------------------------------------------------------------------------

seed: 20260822

simulation:
  start_date: "2025-01-01"
  days: 90
  currency: "INR"
  # Regulatory reporting threshold used by structuring / smurfing patterns.
  reporting_threshold: 200000      # INR 2 lakh - the alerting threshold
  #                                  launderers structure beneath

population:
  n_accounts: 10000
  foreign_share: 0.02              # share of accounts held outside the home country
  dormant_share: 0.04              # near-zero-activity accounts (mule candidates)
  archetype_mix:
    salary: 0.40
    student: 0.10
    freelancer: 0.08
    household: 0.10
    small_business: 0.18
    merchant: 0.08
    large_business: 0.04
    investment: 0.02

normal_activity:
  p_preferred_counterparty: 0.72   # else sampled by popularity
  n_preferred_range: [3, 25]
  same_city_bias: 3.0              # multiplier on counterparty affinity
  salary_enabled: true
  activity_jitter: 0.35            # per-account multiplicative noise on frequency

laundering:
  difficulty: 0.5
  # Laundering is run by a bounded network, not by the whole population.
  # These shares control how rare suspicious accounts are in the dataset.
  # Episode counts below are written for `population_reference` accounts and are
  # scaled automatically when you change population.n_accounts.
  scale_with_population: true
  population_reference: 10000
  network:
    mule_pool_share: 0.10        # share of retail accounts recruitable as mules
    shell_pool_share: 0.08       # share of business accounts used as fronts
    source_pool_share: 0.06      # share of high-value accounts used as origins
  episodes:
    layering_chain: 50
    circular_flow: 25
    rapid_pass_through: 40
    smurfing: 22
    fan_out: 30
    fan_in: 30
    mule_network: 20
    dormant_activation: 30

# Benign episodes that LOOK like the laundering patterns above.
# Without these your detector just learns "fast money = fraud".
benign_lookalikes:
  enabled: true
  episodes:
    supplier_passthrough: 140
    payroll_fanout: 60
    marketplace_fanin: 60
    treasury_cycle: 40
    installment_split: 90

output:
  dir: "data"
  formats: ["csv"]                 # csv and/or parquet
  write_graphml: true
